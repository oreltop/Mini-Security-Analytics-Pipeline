# Let the ingest endpoint accept either a single event object or an array of them:
# a lone object binds as a 1-element list. Keeps all request binding (and thus our
# transport-level error handling) going through Jackson at the @RequestBody boundary.
spring.jackson.deserialization.accept-single-value-as-array=true

# Zero-trust: reject payloads carrying fields outside the schema rather than
# silently dropping them.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Java 21 virtual threads for request handling — cheap concurrency for blocking
# ingest/analytics I/O (the reason we chose this LTS over 17).
spring.threads.virtual.enabled=true

# Analytics rate limit (stats + samples): fixed window per client IP.
app.rate-limit.requests-per-minute=100
