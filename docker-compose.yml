# Full stack: the app backed by ClickHouse. `docker compose up --build` brings up
# ClickHouse and the app (on the "clickhouse" profile) wired to it.
# For a zero-dependency run instead, use `./mvnw spring-boot:run` (in-memory default).
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: mini-wsa-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: miniwsa
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password miniwsa --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: mini-wsa:latest
    container_name: mini-wsa
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: clickhouse
      SPRING_DATASOURCE_URL: jdbc:clickhouse://clickhouse:8123/default
      SPRING_DATASOURCE_USERNAME: default
      SPRING_DATASOURCE_PASSWORD: miniwsa
    depends_on:
      clickhouse:
        condition: service_healthy
